<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * data: crx:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Homie</title>
<link rel="stylesheet" href="sidebar.css">
</head>
<body>
<div id="sidebar">
  <div id="top" class="drag">
    <button id="toggle" class="nodrag" title="Hide sidebar (Cmd+S)"><svg width="16" height="13" viewBox="0 0 16 13"><rect x="0.6" y="0.6" width="14.8" height="11.8" rx="3" fill="none" stroke="currentColor" stroke-width="1.05"/><line x1="5.9" y1="0.6" x2="5.9" y2="12.4" stroke="currentColor" stroke-width="1.05"/><path d="M2.2 3.5h2.2M2.2 5.5h2.2M2.2 7.5h2.2" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg></button>
  </div>
  <div id="list">
    <div id="groups"></div>
    <section id="todaySection">
      <div id="divider"><button id="clearToday" title="Close all Today tabs">Clear</button></div>
      <div id="newTab" class="tab"><span class="ico"><span class="glyph">+</span></span><span class="label">New Tab</span></div>
      <div id="today"></div>
    </section>
  </div>
  <div id="bottom">
    <div class="left"><button id="dlrow" title="Downloads (Cmd+Shift+J)"><svg width="14" height="14" viewBox="0 0 16 16"><path d="M8 1.5v9M4.5 7 8 10.5 11.5 7M2.5 13.5h11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="meta"></span></button>
    <button id="gear" title="Settings (Cmd+, opens and closes)"><svg width="15" height="15" viewBox="0 0 16 16"><path d="M6.7 1.5h2.6l.4 1.9 1.3.7 1.8-.7 1.3 2.2-1.4 1.3v1.5l1.4 1.3-1.3 2.2-1.8-.7-1.3.7-.4 1.9H6.7l-.4-1.9-1.3-.7-1.8.7-1.3-2.2 1.4-1.3V7.4L1.9 6.1l1.3-2.2 1.8.7 1.3-.7z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><circle cx="8" cy="8.5" r="2" fill="none" stroke="currentColor" stroke-width="1.3"/></svg></button></div>
    <button id="plus" title="New Tab, New Folder, New Split View"><svg width="14" height="14" viewBox="0 0 16 16"><path d="M8 2.5v11M2.5 8h11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
  </div>
  <div id="dlpop"><div class="rows"></div><button class="all">Show all downloads</button></div>
  <div id="handle"></div>
</div>
<div id="cards"></div>
<template id="toolbarT"><div class="toolbar drag">
    <div class="nav">
      <button class="toggle2 nodrag" title="Show sidebar (Cmd+S)"><svg width="16" height="13" viewBox="0 0 16 13"><rect x="0.6" y="0.6" width="14.8" height="11.8" rx="3" fill="none" stroke="currentColor" stroke-width="1.05"/><line x1="5.9" y1="0.6" x2="5.9" y2="12.4" stroke="currentColor" stroke-width="1.05"/><path d="M2.2 3.5h2.2M2.2 5.5h2.2M2.2 7.5h2.2" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg></button>
      <button class="back nodrag" title="Back"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M13 8H3M7 4 3 8l4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="fwd nodrag" title="Forward"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M3 8h10M9 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="reload nodrag" title="Reload"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.5-3.6M13 2.5v3h-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <button class="address nodrag" title="Edit address (Cmd+L)"><svg width="14" height="14" viewBox="0 0 16 16"><path d="M6.5 9.5a3 3 0 0 0 4.2 0l2-2a3 3 0 0 0-4.2-4.2l-1 1M9.5 6.5a3 3 0 0 0-4.2 0l-2 2a3 3 0 0 0 4.2 4.2l1-1" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span class="host"></span></button>
    <div class="tools"><browser-action-list class="nodrag" partition="persist:homie" alignment="bottom right"></browser-action-list><button class="agent nodrag" title="Claude beside this tab (Cmd+Option+J)"><svg width="15" height="13" viewBox="0 0 15 13"><rect x="0.6" y="0.6" width="13.8" height="11.8" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M3.8 4.2l2.4 2.3-2.4 2.3M7.6 9h3.4" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button class="addSplit nodrag" title="Add Split View (Ctrl+Shift+=)"><svg width="15" height="13" viewBox="0 0 15 13"><rect x="0.6" y="0.6" width="13.8" height="11.8" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.2"/><line x1="7.5" y1="0.6" x2="7.5" y2="12.4" stroke="currentColor" stroke-width="1.2"/></svg></button><button class="paneClose nodrag" title="Close Split View Pane"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M3 3l8 8M11 3l-8 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button></div>
</div></template>
<div id="gutters"></div>
<script src="sidebar.js"></script>
</body>
</html>
