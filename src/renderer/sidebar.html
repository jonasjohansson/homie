<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * data: crx:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Homie</title>
<link rel="stylesheet" href="sidebar.css">
</head>
<body>
<div id="sidebar">
  <div id="top" class="drag">
    <div id="nav">
      <button id="back" class="nodrag" title="Back">‹</button>
      <button id="fwd" class="nodrag" title="Forward">›</button>
      <button id="reload" class="nodrag" title="Reload">↻</button>
      <browser-action-list class="nodrag" partition="persist:homie" alignment="bottom left"></browser-action-list>
    </div>
  </div>
  <div id="omnibox">
    <input id="omni" type="text" spellcheck="false" autocomplete="off" placeholder="Search or enter address">
    <ul id="suggest" hidden></ul>
  </div>
  <div id="list">
    <div id="groups"></div>
    <section id="todaySection">
      <h2><span>Today</span><button id="clearToday" title="Close all Today tabs">Clear</button></h2>
      <div id="today"></div>
    </section>
  </div>
  <div id="downloads" hidden></div>
  <div id="handle"></div>
</div>
<script src="sidebar.js"></script>
</body>
</html>
